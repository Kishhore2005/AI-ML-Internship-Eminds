version: '3.8'

services:
  movie-recommendation-bot:
    build: .
    container_name: movie-recommendation-bot
    ports:
      - "8501:8501"  # Streamlit frontend
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY}
      - IMDB_API_KEY=${IMDB_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - USE_IMDB_API=${USE_IMDB_API:-false}
      - PYTHONPATH=/app
    volumes:
      - ./data:/app/data
      - ./database:/app/database
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s 